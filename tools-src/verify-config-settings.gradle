gradle.projectsEvaluated {
    def p = rootProject.findProject(':client')
    if (p == null) return
    def out = rootProject.layout.buildDirectory.dir('verify-config-settings/classes')
    def compile = p.tasks.register('compileConfigSettingsCheck', JavaCompile) {
        dependsOn p.tasks.named('classes')
        source rootProject.file('tools-src/VerifyConfigSettings.java'), rootProject.file('android/src/androidMain/java/net/runelite/client/config/ConfigUiCodec.java')
        classpath = p.sourceSets.main.runtimeClasspath
        destinationDirectory = out
        options.encoding = 'UTF-8'
    }
    p.tasks.register('verifyConfigSettings', JavaExec) {
        dependsOn compile
        classpath = p.files(out) + p.sourceSets.main.runtimeClasspath
        mainClass = 'net.runelite.client.config.VerifyConfigSettings'
    }
}
